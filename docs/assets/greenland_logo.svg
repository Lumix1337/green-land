<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="greenlandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B5E20" />
      <stop offset="100%" stop-color="#4CAF50" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1B5E20" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#greenlandGrad)" filter="url(#shadow)" />

  <!-- Greenhouse Arch Structure -->
  <path d="M128 368 V256 C128 185.3 185.3 128 256 128 C326.7 128 384 185.3 384 256 V368"
        fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

  <line x1="128" y1="368" x2="384" y2="368" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" />
  <line x1="256" y1="128" x2="256" y2="368" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.7" />
  <line x1="128" y1="256" x2="384" y2="256" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.7" />

  <!-- Sprout / Leaf Icon -->
  <path d="M256 320 C256 260 210 240 180 240 C180 280 210 320 256 320 Z" fill="#81C784" />
  <path d="M256 320 C256 250 310 225 340 225 C340 270 305 320 256 320 Z" fill="#A5D6A7" />
  <circle cx="256" cy="320" r="10" fill="#FFFFFF" />
</svg>
